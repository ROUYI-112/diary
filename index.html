<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>柔柔的英文日記工作坊</title>
<link href="https://fonts.googleapis.com/css2?family=Kalnia:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#241a3d;
  --parch:#f6efe2;
  --parch-deep:#ece0c9;
  --violet:#5b3a97;
  --violet-soft:#8b6ec9;
  --gold:#c8912f;
  --rose:#c0537a;
  --teal:#2f7d75;
  --leaf:#4a9d5f;
  --leaf-deep:#2f7042;
  --bark:#8b5e34;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(circle at 12% 8%, rgba(139,110,201,.18), transparent 45%),
    radial-gradient(circle at 88% 72%, rgba(200,145,47,.16), transparent 42%),
    var(--parch);
  color:var(--ink);
  font-family:'Noto Sans TC',sans-serif;
  line-height:1.75;
  padding:0 0 80px;
  overflow-x:hidden;
}
.wrap{max-width:840px;margin:0 auto;padding:0 20px}

/* ---------- HERO ---------- */
header{padding:56px 0 28px;text-align:center}
.eyebrow{
  font-family:'Space Mono',monospace;
  font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--violet-soft);margin-bottom:16px;
}
h1{
  font-family:'Kalnia',serif;font-weight:600;
  font-size:clamp(2.2rem,6.5vw,3.6rem);line-height:1.1;
  color:var(--violet);letter-spacing:-.01em;
}
h1 em{font-style:normal;color:var(--gold);display:block}
.sub{margin-top:16px;font-size:.98rem;color:#5c5170;max-width:540px;margin-left:auto;margin-right:auto}

/* ---------- DAY TABS ---------- */
.days{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  margin:30px 0 10px;
}
.day-btn{
  font-family:'Space Mono',monospace;font-size:.8rem;letter-spacing:.06em;
  background:#fffdf8;border:1.5px solid var(--parch-deep);
  color:var(--ink);border-radius:14px;padding:11px 18px;
  cursor:pointer;transition:transform .16s,border-color .16s,background .16s;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-width:96px;
}
.day-btn:hover:not(:disabled){transform:translateY(-3px);border-color:var(--violet-soft)}
.day-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.day-btn.active{background:var(--violet);border-color:var(--violet);color:#fff}
.day-btn .dtopic{font-family:'Noto Sans TC',sans-serif;font-size:.72rem;opacity:.75}
.day-btn.locked{opacity:.42;cursor:not-allowed;border-style:dashed}
.day-btn .seed{font-size:.9rem}
.days-note{text-align:center;font-size:.78rem;color:#9a8fb3;margin-bottom:8px}

/* ---------- PROGRESS ---------- */
.progress-rail{
  position:sticky;top:0;z-index:20;
  background:rgba(246,239,226,.93);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--parch-deep);
  padding:12px 0;margin-bottom:26px;
}
.rail-inner{display:flex;align-items:center;gap:14px;max-width:840px;margin:0 auto;padding:0 20px}
.rail-label{font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.1em;color:var(--violet);white-space:nowrap}
.bar{flex:1;height:7px;background:var(--parch-deep);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0%;background:linear-gradient(90deg,var(--leaf),var(--gold));transition:width .55s cubic-bezier(.4,1.4,.5,1)}

/* ---------- TREE + DRAFT ---------- */
.grow-zone{
  display:grid;grid-template-columns:200px 1fr;gap:22px;
  background:linear-gradient(180deg,#fffdf8,#f9f3e6);
  border:2px dashed var(--violet-soft);
  border-radius:20px;padding:22px;margin-bottom:26px;
}
.tree-box{
  background:linear-gradient(180deg,#eaf5ec 0%,#f6efe2 88%);
  border-radius:16px;padding:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;position:relative;overflow:hidden;
}
#tree{width:100%;height:230px}
.tree-cap{
  font-family:'Space Mono',monospace;font-size:.66rem;letter-spacing:.08em;
  color:var(--leaf-deep);padding:6px 0 2px;text-align:center;
}
.draft-side h2{font-family:'Kalnia',serif;font-size:1.3rem;color:var(--violet);font-weight:600}
.draft-note{font-size:.8rem;color:#7a6f8f;margin-bottom:12px}
#draft{font-size:1rem;line-height:1.95;color:var(--ink);min-height:56px}
#draft .s{opacity:0;animation:fade .5s forwards}
#draft .s.hl{background:linear-gradient(transparent 62%,rgba(200,145,47,.35) 0)}
@keyframes fade{to{opacity:1}}
.placeholder{color:#a89ec0;font-style:italic}

/* tree parts */
.sprout-part{opacity:0;transform-origin:center bottom}
.sprout-part.grown{animation:sprout .7s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes sprout{
  0%{opacity:0;transform:scale(.2) translateY(14px)}
  70%{opacity:1;transform:scale(1.12) translateY(0)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
.sway{animation:sway 4.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}

/* ---------- STEP CARDS ---------- */
.step{
  background:#fffdf8;border:1px solid var(--parch-deep);
  border-radius:20px;padding:24px 22px;margin-bottom:20px;
  box-shadow:0 3px 0 var(--parch-deep);
}
.step.done{border-color:var(--leaf);box-shadow:0 3px 0 rgba(74,157,95,.3)}
.step-head{display:flex;align-items:flex-start;gap:13px;margin-bottom:4px}
.num{
  font-family:'Space Mono',monospace;font-weight:700;font-size:.76rem;
  background:var(--violet);color:#fff;min-width:33px;height:33px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.step.done .num{background:var(--leaf)}
.step-title{font-weight:700;font-size:1.05rem;padding-top:3px}
.think{
  background:var(--parch);border-left:3px solid var(--gold);
  padding:12px 15px;border-radius:0 10px 10px 0;
  font-size:.92rem;color:#54486d;margin:13px 0 15px;
}
.think b{color:var(--rose)}
.q{font-weight:500;font-size:.94rem;margin-bottom:11px;color:var(--violet)}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{
  text-align:left;font-family:inherit;font-size:.94rem;line-height:1.6;
  background:#fff;border:1.5px solid var(--parch-deep);border-radius:13px;
  padding:12px 15px;cursor:pointer;color:var(--ink);
  transition:transform .16s,border-color .16s,background .16s;
}
.choice:hover:not(:disabled){transform:translateX(5px);border-color:var(--violet-soft)}
.choice:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.choice.right{background:#eefaf3;border-color:var(--teal);color:var(--teal);font-weight:500}
.choice.wrong{background:#fdeef2;border-color:var(--rose);color:var(--rose);opacity:.85}
.choice:disabled{cursor:default}
.tag{font-family:'Space Mono',monospace;font-size:.65rem;letter-spacing:.05em;opacity:.7;display:block;margin-top:5px}
.feedback{margin-top:13px;padding:12px 15px;border-radius:12px;font-size:.89rem;display:none}
.feedback.show{display:block;animation:pop .32s ease}
.feedback.ok{background:#eefaf3;color:#1f5c55;border:1px solid #b9e2d8}
.feedback.no{background:#fdeef2;color:#8f3352;border:1px solid #f0c6d3}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---------- FINALE ---------- */
.finale{display:none;background:var(--ink);color:var(--parch);border-radius:22px;padding:30px 25px;margin-top:26px}
.finale.show{display:block;animation:pop .5s ease}
.finale h2{font-family:'Kalnia',serif;color:var(--gold);font-size:1.5rem;margin-bottom:12px;font-weight:600}
.finale p{font-size:.94rem;color:#d9d0ea}
.final-text{background:rgba(255,255,255,.07);border-radius:14px;padding:19px;margin:16px 0;line-height:1.95;color:#fff}
.checklist{list-style:none;font-size:.88rem}
.checklist li{padding:6px 0 6px 25px;position:relative;color:#d9d0ea}
.checklist li::before{content:"✦";position:absolute;left:0;color:var(--gold)}
.count{font-family:'Space Mono',monospace;color:var(--gold);font-size:.78rem;letter-spacing:.1em;margin-top:14px;display:block}

@media(max-width:640px){
  .grow-zone{grid-template-columns:1fr}
  #tree{height:190px}
  .step{padding:19px 16px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  #draft .s,.sprout-part{opacity:1}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="eyebrow">A D D · 高 二 · 英 文 寫 作</div>
    <h1>柔柔的<em>英文日記</em>工作坊</h1>
    <p class="sub">一句一句想，一句一句寫。每寫對一句，小樹就長高一點——七句寫完，整棵樹就長好了。</p>

    <div class="days" id="days"></div>
    <p class="days-note">之後每天都會多一顆按鈕 🌱</p>
  </div>
</header>

<div class="progress-rail">
  <div class="rail-inner">
    <span class="rail-label" id="dayLabel">7/24</span>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <span class="rail-label" id="pct">0 / 7</span>
  </div>
</div>

<div class="wrap">

  <div class="grow-zone">
    <div>
      <div class="tree-box">
        <svg id="tree" viewBox="0 0 160 230" aria-label="日記小樹">
          <!-- soil -->
          <ellipse cx="80" cy="214" rx="52" ry="9" fill="#c9a878"/>
          <ellipse cx="80" cy="211" rx="44" ry="7" fill="#a8814f"/>
          <g class="sway" style="transform-origin:80px 211px">
            <!-- 1 seedling stem -->
            <g class="sprout-part" id="p1">
              <path d="M80 211 L80 186" stroke="#6bbf7d" stroke-width="4" stroke-linecap="round"/>
              <path d="M80 192 q-16 -6 -19 -18 q16 1 19 18Z" fill="#7ecb8c"/>
              <path d="M80 196 q16 -5 20 -17 q-17 0 -20 17Z" fill="#6bbf7d"/>
            </g>
            <!-- 2 trunk grows -->
            <g class="sprout-part" id="p2">
              <path d="M80 211 L80 156" stroke="#8b5e34" stroke-width="7" stroke-linecap="round"/>
            </g>
            <!-- 3 left branch -->
            <g class="sprout-part" id="p3">
              <path d="M80 176 q-20 -8 -30 -26" stroke="#8b5e34" stroke-width="5" fill="none" stroke-linecap="round"/>
              <ellipse cx="48" cy="147" rx="15" ry="12" fill="#4a9d5f"/>
            </g>
            <!-- 4 right branch -->
            <g class="sprout-part" id="p4">
              <path d="M80 168 q22 -9 33 -28" stroke="#8b5e34" stroke-width="5" fill="none" stroke-linecap="round"/>
              <ellipse cx="115" cy="138" rx="16" ry="13" fill="#5aae6c"/>
            </g>
            <!-- 5 canopy -->
            <g class="sprout-part" id="p5">
              <circle cx="80" cy="124" r="30" fill="#4a9d5f"/>
              <circle cx="58" cy="134" r="20" fill="#5aae6c"/>
              <circle cx="103" cy="132" r="21" fill="#3f8f54"/>
            </g>
            <!-- 6 blossoms -->
            <g class="sprout-part" id="p6">
              <circle cx="63" cy="116" r="5" fill="#f2a9c4"/>
              <circle cx="95" cy="110" r="5" fill="#f2a9c4"/>
              <circle cx="80" cy="136" r="4.5" fill="#ffd3e2"/>
              <circle cx="110" cy="126" r="4" fill="#f2a9c4"/>
              <circle cx="50" cy="140" r="4" fill="#ffd3e2"/>
            </g>
            <!-- 7 fruit + sparkle -->
            <g class="sprout-part" id="p7">
              <circle cx="70" cy="130" r="6" fill="#c8912f"/>
              <circle cx="99" cy="123" r="6" fill="#e0a63c"/>
              <path d="M126 92 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3Z" fill="#ffd977"/>
              <path d="M32 104 l2.4 6 6 2.4 -6 2.4 -2.4 6 -2.4 -6 -6 -2.4 6 -2.4Z" fill="#ffd977"/>
            </g>
          </g>
        </svg>
      </div>
      <div class="tree-cap" id="treeCap">播下一顆種子⋯⋯</div>
    </div>

    <div class="draft-side">
      <h2>你的日記，即時長大中</h2>
      <p class="draft-note">每答對一題，句子就會出現在這裡。</p>
      <div id="draft"><span class="placeholder">還是一張白紙⋯⋯往下開始吧！</span></div>
    </div>
  </div>

  <div id="steps"></div>

  <div class="finale" id="finale">
    <h2>樹長好了！</h2>
    <p>柔柔，你剛剛不是「翻譯」一篇日記，而是<b>一句一句想出來</b>的。這就是課本 p.220 說的連貫性。</p>
    <div class="final-text" id="finalText"></div>
    <p style="margin-bottom:9px"><b style="color:var(--gold)">你用到的句型：</b></p>
    <ul class="checklist" id="patternList"></ul>
    <span class="count" id="wordCount"></span>
  </div>

</div>

<script>
/* ===== 每天一組。之後加新日期，只要往 DIARIES 陣列再 push 一個物件 ===== */
const DIARIES = [
{
  date:"7/24", topic:"奇幻小說",
  patterns:[
    "The moment + S + V…, S + V…（Ch.1 U1 句型2）",
    "S + turn out + to + VR（Ch.1 U3 句型4）",
    "no matter + how/what…（Ch.3 U1 句型2）",
    "be full of + N（Ch.2 U3 句型3）",
    "S + make + O + VR（Ch.7 U1 句型3）",
    "In short, S + V…（Ch.4 U1 句型5）",
    "make…difference（Ch.2 U3 句型5）"
  ],
  steps:[
  {
    title:"主題句：先講「我最近迷上什麼」",
    think:"課本第1步說每段要有<b>主題句</b>。中文你想說的是「我最近對奇幻題材很有興趣」。先問自己：這是<b>最近</b>發生、而且<b>還在持續</b>的事，所以要用<b>現在完成式</b>，不是過去式。",
    q:"哪一句最適合當開頭？",
    opts:[
      {t:"Yesterday I read a fantasy book.", tag:"只講一天的事，太小", ok:false},
      {t:"Recently, I have become really into fantasy stories.", tag:"現在完成式＋ be into sth.（Ch.5 U2 句型1）", ok:true},
      {t:"Fantasy is a kind of story with magic.", tag:"這是定義，不是你的感受", ok:false}
    ],
    ok:"對！「Recently + 現在完成式」直接告訴讀者：這是最近開始、到現在還在的興趣。主題句立好了。",
    no:"再想一次：日記要寫<b>你的</b>感受，而且是<b>最近一直</b>在發生的事，不是某一天、也不是查字典的解釋。",
    sent:"Recently, I have become really into fantasy stories."
  },
  {
    title:"支持細節①：這件事怎麼開始的",
    think:"課本第2步：主題句後面要<b>支持細節</b>。中文：「上個月讀完第一本的那一刻，我就知道我找到了特別的東西。」<b>那一刻</b>——這正好用得上 Ch.1 U1 句型2。",
    q:"「那一刻」要怎麼寫？",
    opts:[
      {t:"When I finish my first fantasy novel, I know it is special.", tag:"時態錯，過去的事要用過去式", ok:false},
      {t:"I finished my first fantasy novel last month. It was special.", tag:"兩句斷開，沒有「那一刻」的力道", ok:false},
      {t:"The moment I finished my first fantasy novel last month, I knew I had found something special.", tag:"The moment + S + V…, S + V…", ok:true}
    ],
    ok:"漂亮。The moment = as soon as，比 when 更有「就在那一瞬間」的畫面感。knew 之後接 had found，是過去完成式，順序很清楚。",
    no:"提示：課本 Ch.1 Unit 1 句型2 就是專門用來寫「一⋯⋯就⋯⋯」的。而且事情發生在 last month，動詞要用過去式。",
    sent:"The moment I finished my first fantasy novel last month, I knew I had found something special."
  },
  {
    title:"轉承詞：把時間往後推",
    think:"課本第4步說要用<b>轉承詞</b>。上一句講「上個月開始」，這一句要講「從那之後我一本接一本」。中文的「從那之後」＝ Since then，後面同樣用現在完成式。",
    q:"哪一句最順？",
    opts:[
      {t:"Also, I read many books and they are exciting.", tag:"Also 太弱，看不出時間關係", ok:false},
      {t:"Since then, I have read one book after another, and each one has turned out to be more exciting than the last.", tag:"Since then ＋ turn out to（Ch.1 U3 句型4）", ok:true},
      {t:"However, I have read many fantasy novels.", tag:"However 是轉折，但這裡沒有轉折", ok:false}
    ],
    ok:"很好！Since then 接住了上一句的 last month，讀者跟得上時間。turned out to be 又帶出「結果比想像中更好」的驚喜感。",
    no:"注意轉承詞的<b>意思</b>：上一句是時間點，這一句要延續時間，所以要用「從那之後」，不是「而且」也不是「然而」。",
    sent:"Since then, I have read one book after another, and each one has turned out to be more exciting than the last."
  },
  {
    title:"支持細節②：你多愛讀它",
    think:"再加一個細節：「不管我多忙，睡前都會讀個幾頁。」<b>不管多忙</b>——Ch.3 U1 句型2 的 no matter 正好派上用場。",
    q:"「不管我多忙」怎麼說？",
    opts:[
      {t:"I am very busy but I read before bed.", tag:"意思到了，但句型太平", ok:false},
      {t:"No matter what busy I am, I read before bed.", tag:"busy 是形容詞，要配 how 不是 what", ok:false},
      {t:"No matter how busy I am, I always find time to read a few pages before bed.", tag:"no matter + how + adj. + S + V", ok:true}
    ],
    ok:"正確。no matter 後面接形容詞時要用 how（no matter how busy）。加上 before bed 這個小細節，畫面立刻具體。",
    no:"小提醒：no matter <b>how</b> + 形容詞（多忙）／no matter <b>what</b> + 名詞（什麼事）。這裡是「多忙」。",
    sent:"No matter how busy I am, I always find time to read a few pages before bed."
  },
  {
    title:"支持細節③：說出「為什麼」喜歡",
    think:"最重要的一步。課本 p.220 的反例就是——只講「很好玩」卻沒解釋<b>為什麼</b>。所以這句要回答：奇幻小說到底哪裡吸引你？想三樣具體的東西：魔法、勇敢的主角、不可能的冒險。",
    q:"哪一句真的解釋了原因？",
    opts:[
      {t:"I like fantasy novels because they are fun.", tag:"這就是課本說的「不連貫」寫法", ok:false},
      {t:"Fantasy novels are long or short.", tag:"和主題無關，會離題", ok:false},
      {t:"What I love most is that these worlds are full of magic, brave heroes, and impossible adventures.", tag:"be full of + N（Ch.2 U3 句型3）＋ 三個具體例子", ok:true}
    ],
    ok:"這就是好段落跟壞段落的差別。「fun」是空話，但 magic / brave heroes / impossible adventures 是<b>看得見的東西</b>——讀者能想像。",
    no:"回頭看課本 p.220 那個爛例子：「Movies are good because they are fun.」為什麼爛？因為 fun 什麼都沒說。要給<b>具體</b>的東西。",
    sent:"What I love most is that these worlds are full of magic, brave heroes, and impossible adventures."
  },
  {
    title:"再補一句感受，準備收尾",
    think:"在總結之前，加一句最貼近你自己的話：「讀它們讓我忘記煩惱。」短短一句，但很真。",
    q:"選一句：",
    opts:[
      {t:"Reading them makes me to forget my worries.", tag:"make 後面接原形，不加 to", ok:false},
      {t:"Reading them makes me forget my worries.", tag:"S + make + O + VR（Ch.7 U1 句型3）", ok:true},
      {t:"I like to eat snacks when I read.", tag:"跳到零食＝離題（就像課本的爆米花）", ok:false}
    ],
    ok:"對，make + O + <b>原形動詞</b>，不加 to。而且這句緊扣主題，沒有跑去講零食。",
    no:"兩個陷阱：一是 make 後面的動詞<b>不加 to</b>；二是千萬別像課本例子那樣，結尾突然講起爆米花。",
    sent:"Reading them makes me forget my worries."
  },
  {
    title:"結尾句：把整段收起來",
    think:"課本第5步：好段落要有<b>結束句</b>，總結重點。用 In short 開頭（Ch.4 U1 句型5），再用 make a difference（Ch.2 U3 句型5）說明它對你的意義。注意——結尾必須回到<b>主題</b>。",
    q:"哪一句是好結尾？",
    opts:[
      {t:"So that is my diary today.", tag:"沒有總結任何東西", ok:false},
      {t:"In short, I also want to learn how to cook.", tag:"完全離題", ok:false},
      {t:"In short, fantasy novels have made a big difference in my life.", tag:"In short ＋ make…difference", ok:true}
    ],
    ok:"完美收尾。In short 提示讀者「我要總結了」，made a big difference 呼應了開頭的 become really into——整段首尾相扣。",
    no:"結尾句要<b>總結主題</b>。想想課本說的：不能像那個例子一樣，最後突然講爆米花。",
    sent:"In short, fantasy novels have made a big difference in my life."
  }
]}
];

/* ===== 之後的日期（還沒開放） ===== */
const UPCOMING = [
  {date:"7/25", topic:"敬請期待"},
  {date:"7/26", topic:"敬請期待"}
];

const daysEl=document.getElementById('days'), stepsEl=document.getElementById('steps'),
      draftEl=document.getElementById('draft'), fillEl=document.getElementById('fill'),
      pctEl=document.getElementById('pct'), dayLabel=document.getElementById('dayLabel'),
      treeCap=document.getElementById('treeCap'), finale=document.getElementById('finale');

const CAPS=["播下一顆種子⋯⋯","小芽冒出來了！","長出主幹了","抽出第一根枝","第二根枝也來了","樹冠成形！","開花了 🌸","結果啦！整棵樹長好了"];
let cur=0, solved=0;

/* ---- day buttons ---- */
function buildDays(){
  daysEl.innerHTML='';
  DIARIES.forEach((d,i)=>{
    const b=document.createElement('button');
    b.className='day-btn'+(i===cur?' active':'');
    b.innerHTML=`<span class="seed">🌳</span>${d.date}<span class="dtopic">${d.topic}</span>`;
    b.addEventListener('click',()=>{cur=i;load();});
    daysEl.appendChild(b);
  });
  UPCOMING.forEach(u=>{
    const b=document.createElement('button');
    b.className='day-btn locked';b.disabled=true;
    b.innerHTML=`<span class="seed">🌰</span>${u.date}<span class="dtopic">${u.topic}</span>`;
    daysEl.appendChild(b);
  });
}

/* ---- load a day ---- */
function load(){
  const D=DIARIES[cur];
  solved=0;
  buildDays();
  dayLabel.textContent=D.date;
  finale.classList.remove('show');
  draftEl.innerHTML='<span class="placeholder">還是一張白紙⋯⋯往下開始吧！</span>';
  document.querySelectorAll('.sprout-part').forEach(p=>p.classList.remove('grown'));
  treeCap.textContent=CAPS[0];
  updateBar();

  stepsEl.innerHTML='';
  D.steps.forEach((s,i)=>{
    const card=document.createElement('section');
    card.className='step';
    card.innerHTML=`
      <div class="step-head">
        <div class="num">${String(i+1).padStart(2,'0')}</div>
        <div class="step-title">${s.title}</div>
      </div>
      <div class="think"><b>先想：</b>${s.think}</div>
      <div class="q">${s.q}</div>
      <div class="choices"></div>
      <div class="feedback"></div>`;
    const box=card.querySelector('.choices'), fb=card.querySelector('.feedback');
    s.opts.forEach(o=>{
      const b=document.createElement('button');
      b.className='choice';
      b.innerHTML=`${o.t}<span class="tag">${o.tag}</span>`;
      b.addEventListener('click',()=>{
        if(o.ok){
          b.classList.add('right');
          box.querySelectorAll('.choice').forEach(x=>x.disabled=true);
          fb.className='feedback ok show';
          fb.innerHTML=`<b>✓ 答對了 —</b> ${s.ok}`;
          card.classList.add('done');
          addSentence(s.sent);
          solved++;
          growTree(solved);
          updateBar();
        }else{
          b.classList.add('wrong');b.disabled=true;
          fb.className='feedback no show';
          fb.innerHTML=`<b>再想想 —</b> ${s.no}`;
        }
      });
      box.appendChild(b);
    });
    stepsEl.appendChild(card);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

function growTree(n){
  const part=document.getElementById('p'+n);
  if(part) part.classList.add('grown');
  treeCap.textContent=CAPS[n]||CAPS[CAPS.length-1];
}

function addSentence(t){
  const ph=draftEl.querySelector('.placeholder'); if(ph) ph.remove();
  const sp=document.createElement('span');
  sp.className='s hl'; sp.textContent=t+' ';
  draftEl.appendChild(sp);
  setTimeout(()=>sp.classList.remove('hl'),1400);
}

function updateBar(){
  const total=DIARIES[cur].steps.length;
  fillEl.style.width=(solved/total*100)+'%';
  pctEl.textContent=`${solved} / ${total}`;
  if(solved===total) finish();
}

function finish(){
  const D=DIARIES[cur];
  const full=D.steps.map(s=>s.sent).join(' ');
  document.getElementById('finalText').textContent=full;
  document.getElementById('wordCount').textContent=
    `共 ${full.trim().split(/\s+/).length} 字 · ${D.steps.length} 個句子 · ${D.patterns.length} 個課本句型`;
  document.getElementById('patternList').innerHTML=D.patterns.map(p=>`<li>${p}</li>`).join('');
  finale.classList.add('show');
  setTimeout(()=>finale.scrollIntoView({behavior:'smooth',block:'center'}),350);
}

load();
</script>
</body>
</html>

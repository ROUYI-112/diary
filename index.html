<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>柔柔的英文寫作學習站</title>
<link href="https://fonts.googleapis.com/css2?family=Kalnia:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#241a3d;--paper:#f6efe2;--paper2:#ece0c9;--violet:#5b3a97;--violet-soft:#8b6ec9;--magenta:#c0316b;--magenta-soft:#e07ba6;--green:#3a7d5c;--green-soft:#6fbf94;--gold:#c8912f;--teal:#2f7d75;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 12% 8%,rgba(139,110,201,.18),transparent 45%),radial-gradient(circle at 88% 78%,rgba(224,123,166,.16),transparent 42%),var(--paper);color:var(--ink);font-family:'Noto Sans TC',sans-serif;min-height:100vh;}
.topbar{position:sticky;top:0;z-index:100;background:rgba(246,239,226,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--paper2);padding:10px 0;}
.topbar-inner{max-width:980px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:'Kalnia',serif;font-weight:600;font-size:1.05rem;color:var(--violet);white-space:nowrap}
.logo .z{color:var(--gold)}
.switch{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.sw-btn{font-family:inherit;font-size:.88rem;font-weight:500;background:#fff;border:1.5px solid var(--paper2);color:var(--ink);border-radius:99px;padding:9px 16px;cursor:pointer;transition:.16s;display:flex;align-items:center;gap:6px}
.sw-btn:hover{transform:translateY(-2px)}
.sw-btn.active[data-v="rourou"]{background:var(--violet);border-color:var(--violet);color:#fff}
.sw-btn.active[data-v="feige"]{background:var(--magenta);border-color:var(--magenta);color:#fff}
.sw-btn.active[data-v="grammar"]{background:var(--green);border-color:var(--green);color:#fff}
.frame-wrap{max-width:100%;}
iframe{width:100%;border:0;display:block;min-height:calc(100vh - 60px)}
.hide{display:none}
.landing{max-width:980px;margin:0 auto;padding:46px 20px 60px;text-align:center}
.landing .brand{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--violet-soft);margin-bottom:14px}
.landing h1{font-family:'Kalnia',serif;font-weight:600;font-size:clamp(2rem,6vw,3.2rem);line-height:1.12;color:var(--violet)}
.landing h1 em{font-style:normal;color:var(--gold);display:block;font-size:.6em;margin-top:6px}
.landing .sub{margin:16px auto 0;max-width:520px;font-size:.98rem;color:#5c5170}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:36px}
.card{background:#fff;border:1.5px solid var(--paper2);border-radius:22px;padding:26px 22px;cursor:pointer;transition:.2s;text-align:left;position:relative;overflow:hidden}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 40px rgba(91,58,151,.16)}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.card .emoji{font-size:2.4rem;display:block;margin-bottom:10px}
.card h2{font-family:'Kalnia',serif;font-size:1.3rem;font-weight:600;margin-bottom:6px}
.card.rr h2{color:var(--violet)}.card.fg h2{color:var(--magenta)}.card.gr h2{color:var(--green)}
.card .desc{font-size:.86rem;color:#6a5f7e;line-height:1.6}
.card .tags{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.card .t{font-family:'Space Mono',monospace;font-size:.64rem;background:var(--paper);border-radius:7px;padding:4px 8px;color:var(--violet)}
.card.fg .t{color:var(--magenta)}.card.gr .t{color:var(--green)}
.card .go{margin-top:14px;font-weight:700;font-size:.88rem;display:inline-flex;align-items:center;gap:5px}
.card.rr .go{color:var(--violet)}.card.fg .go{color:var(--magenta)}.card.gr .go{color:var(--green)}
.card .bg-emoji{position:absolute;right:-10px;bottom:-16px;font-size:5.6rem;opacity:.08;line-height:1}
@media(max-width:760px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar hide" id="topbar">
  <div class="topbar-inner">
    <span class="logo">柔柔的<span class="z">寫作學習站</span></span>
    <div class="switch">
      <button class="sw-btn active" data-v="rourou" id="swRourou">✍️ 柔柔日記</button>
      <button class="sw-btn" data-v="feige" id="swFeige">📚 飛哥五句手冊</button>
      <button class="sw-btn" data-v="grammar" id="swGrammar">🎯 三大文法</button>
      <button class="sw-btn" data-v="home" id="swHome">🏠 首頁</button>
    </div>
  </div>
</div>

<div class="landing" id="landing">
  <div class="brand">A D D · 高 二 · 英 文 寫 作</div>
  <h1>柔柔的<em>英文寫作學習站</em></h1>
  <p class="sub">三套練習，一個地方。選一個開始吧。</p>
  <div class="cards">
    <button class="card rr" id="cardRourou">
      <span class="bg-emoji">🌳</span><span class="emoji">✍️</span>
      <h2>柔柔的日記工作坊</h2>
      <p class="desc">每日英文日記。心智圖發想、一句一句寫（長小樹苗）、引導式翻譯四步驟。</p>
      <div class="tags"><span class="t">7/24・7/25</span><span class="t">心智圖</span><span class="t">寫作＋翻譯</span></div>
      <span class="go">開始 →</span>
    </button>
    <button class="card fg" id="cardFeige">
      <span class="bg-emoji">📖</span><span class="emoji">📚</span>
      <h2>飛哥五句式翻譯手冊</h2>
      <p class="desc">十篇範文背誦。畫面感、文法解析、單字表、心智圖、背誦填空。</p>
      <div class="tags"><span class="t">10 篇範文</span><span class="t">心智圖</span><span class="t">背誦填空</span></div>
      <span class="go">開始 →</span>
    </button>
    <button class="card gr" id="cardGrammar">
      <span class="bg-emoji">🎯</span><span class="emoji">🎯</span>
      <h2>高中三大文法</h2>
      <p class="desc">用 115 學測真句子練分詞・假設・倒裝。答對集星星、連對噴火花、破關解鎖徽章。</p>
      <div class="tags"><span class="t">分詞🥇</span><span class="t">假設🥈</span><span class="t">倒裝🥉</span></div>
      <span class="go">開始 →</span>
    </button>
  </div>
</div>

<div class="frame-wrap hide" id="frameWrap">
  <iframe id="frameRourou" class="hide" srcdoc="<!DOCTYPE html>
<html lang=&quot;zh-Hant&quot;>
<head>
<meta charset=&quot;UTF-8&quot;>
<meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>
<title>柔柔的英文日記工作坊</title>
<link href=&quot;https://fonts.googleapis.com/css2?family=Kalnia:wght@400;600;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;family=Space+Mono:wght@400;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;>
<style>
:root{
  --ink:#241a3d;--parch:#f6efe2;--parch-deep:#ece0c9;
  --violet:#5b3a97;--violet-soft:#8b6ec9;--gold:#c8912f;
  --rose:#c0537a;--teal:#2f7d75;--leaf:#4a9d5f;--leaf-deep:#2f7042;
  --sBlue:#2f6fb0;--vRed:#c04a3d;--oGreen:#3f8f54;--cPurple:#7a4bab;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(circle at 12% 8%,rgba(139,110,201,.18),transparent 45%),
             radial-gradient(circle at 88% 72%,rgba(200,145,47,.16),transparent 42%),var(--parch);
  color:var(--ink);font-family:'Noto Sans TC',sans-serif;line-height:1.75;
  padding:0 0 80px;overflow-x:hidden;
}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}

header{padding:52px 0 24px;text-align:center}
.eyebrow{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.28em;
  text-transform:uppercase;color:var(--violet-soft);margin-bottom:16px}
h1{font-family:'Kalnia',serif;font-weight:600;font-size:clamp(2.2rem,6.5vw,3.6rem);
  line-height:1.1;color:var(--violet)}
h1 em{font-style:normal;color:var(--gold);display:block}
.sub{margin-top:16px;font-size:.98rem;color:#5c5170;max-width:560px;margin:16px auto 0}

/* ---- MODE SWITCH ---- */
.modes{display:flex;gap:10px;justify-content:center;margin:26px 0 6px;flex-wrap:wrap}
.mode-btn{font-family:'Noto Sans TC',sans-serif;font-size:.9rem;font-weight:500;
  background:#fffdf8;border:1.5px solid var(--parch-deep);color:var(--ink);
  border-radius:99px;padding:11px 22px;cursor:pointer;transition:.16s}
.mode-btn:hover{transform:translateY(-2px);border-color:var(--violet-soft)}
.mode-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mode-btn.active{background:var(--ink);border-color:var(--ink);color:var(--parch)}

.days{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:22px 0 8px}
.day-btn{font-family:'Space Mono',monospace;font-size:.8rem;background:#fffdf8;
  border:1.5px solid var(--parch-deep);color:var(--ink);border-radius:14px;
  padding:10px 17px;cursor:pointer;transition:.16s;display:flex;flex-direction:column;
  align-items:center;gap:3px;min-width:94px}
.day-btn:hover:not(:disabled){transform:translateY(-3px);border-color:var(--violet-soft)}
.day-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.day-btn.active{background:var(--violet);border-color:var(--violet);color:#fff}
.day-btn .dtopic{font-family:'Noto Sans TC',sans-serif;font-size:.72rem;opacity:.75}
.day-btn.locked{opacity:.42;cursor:not-allowed;border-style:dashed}
.days-note{text-align:center;font-size:.78rem;color:#9a8fb3;margin-bottom:6px}

.progress-rail{position:sticky;top:0;z-index:20;background:rgba(246,239,226,.93);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--parch-deep);padding:12px 0;margin-bottom:24px}
.rail-inner{display:flex;align-items:center;gap:14px;max-width:860px;margin:0 auto;padding:0 20px}
.rail-label{font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.1em;color:var(--violet);white-space:nowrap}
.bar{flex:1;height:7px;background:var(--parch-deep);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0%;background:linear-gradient(90deg,var(--leaf),var(--gold));transition:width .55s cubic-bezier(.4,1.4,.5,1)}

/* ---- TREE + DRAFT ---- */
.grow-zone{display:grid;grid-template-columns:190px 1fr;gap:22px;
  background:linear-gradient(180deg,#fffdf8,#f9f3e6);border:2px dashed var(--violet-soft);
  border-radius:20px;padding:22px;margin-bottom:26px}
.tree-box{background:linear-gradient(180deg,#eaf5ec,#f6efe2 88%);border-radius:16px;
  padding:8px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
#tree{width:100%;height:225px}
.tree-cap{font-family:'Space Mono',monospace;font-size:.66rem;letter-spacing:.08em;
  color:var(--leaf-deep);padding:6px 0 0;text-align:center}
.draft-side h2{font-family:'Kalnia',serif;font-size:1.3rem;color:var(--violet);font-weight:600}
.draft-note{font-size:.8rem;color:#7a6f8f;margin-bottom:12px}
#draft{font-size:1rem;line-height:1.95;min-height:56px}
#draft .s{opacity:0;animation:fade .5s forwards}
#draft .s.hl{background:linear-gradient(transparent 62%,rgba(200,145,47,.35) 0)}
@keyframes fade{to{opacity:1}}
.placeholder{color:#a89ec0;font-style:italic}
.sprout-part{opacity:0;transform-origin:center bottom}
.sprout-part.grown{animation:sprout .7s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes sprout{0%{opacity:0;transform:scale(.2) translateY(14px)}
  70%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
.sway{animation:sway 4.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}

/* ---- SHARED CARD ---- */
.step{background:#fffdf8;border:1px solid var(--parch-deep);border-radius:20px;
  padding:24px 22px;margin-bottom:20px;box-shadow:0 3px 0 var(--parch-deep)}
.step.done{border-color:var(--leaf);box-shadow:0 3px 0 rgba(74,157,95,.3)}
.step-head{display:flex;align-items:flex-start;gap:13px;margin-bottom:4px}
.num{font-family:'Space Mono',monospace;font-weight:700;font-size:.76rem;background:var(--violet);
  color:#fff;min-width:33px;height:33px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0}
.step.done .num{background:var(--leaf)}
.step-title{font-weight:700;font-size:1.05rem;padding-top:3px}
.think{background:var(--parch);border-left:3px solid var(--gold);padding:12px 15px;
  border-radius:0 10px 10px 0;font-size:.92rem;color:#54486d;margin:13px 0 15px}
.think b{color:var(--rose)}
.q{font-weight:500;font-size:.94rem;margin-bottom:11px;color:var(--violet)}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{text-align:left;font-family:inherit;font-size:.94rem;line-height:1.6;background:#fff;
  border:1.5px solid var(--parch-deep);border-radius:13px;padding:12px 15px;cursor:pointer;
  color:var(--ink);transition:.16s}
.choice:hover:not(:disabled){transform:translateX(5px);border-color:var(--violet-soft)}
.choice:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.choice.right{background:#eefaf3;border-color:var(--teal);color:var(--teal);font-weight:500}
.choice.wrong{background:#fdeef2;border-color:var(--rose);color:var(--rose);opacity:.85}
.choice:disabled{cursor:default}
.tag{font-family:'Space Mono',monospace;font-size:.65rem;opacity:.7;display:block;margin-top:5px}
.feedback{margin-top:13px;padding:12px 15px;border-radius:12px;font-size:.89rem;display:none}
.feedback.show{display:block;animation:pop .32s ease}
.feedback.ok{background:#eefaf3;color:#1f5c55;border:1px solid #b9e2d8}
.feedback.no{background:#fdeef2;color:#8f3352;border:1px solid #f0c6d3}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ================= TRANSLATION MODE ================= */
.tr-intro{background:#fffdf8;border:1px solid var(--parch-deep);border-radius:20px;
  padding:22px;margin-bottom:22px}
.tr-intro h2{font-family:'Kalnia',serif;font-size:1.35rem;color:var(--violet);font-weight:600;margin-bottom:8px}
.tr-intro p{font-size:.92rem;color:#5c5170}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.lg{font-family:'Space Mono',monospace;font-size:.7rem;padding:5px 11px;border-radius:8px;color:#fff}
.lg.s{background:var(--sBlue)}.lg.v{background:var(--vRed)}
.lg.o{background:var(--oGreen)}.lg.c{background:var(--cPurple)}

.zh-line{background:linear-gradient(180deg,#fff,#faf4e8);border:2px solid var(--gold);
  border-radius:16px;padding:18px 20px;margin-bottom:8px}
.zh-label{font-family:'Space Mono',monospace;font-size:.66rem;letter-spacing:.14em;
  color:var(--gold);margin-bottom:6px}
.zh-text{font-size:1.12rem;font-weight:500;line-height:1.9}

/* stage 1: chunk tagging */
.chunks{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chunk{background:#fff;border:1.5px solid var(--parch-deep);border-radius:11px;
  padding:9px 13px;font-size:.95rem;position:relative}
.chunk.tagged{color:#fff;border-color:transparent;font-weight:500}
.chunk.tagged.S{background:var(--sBlue)}.chunk.tagged.V{background:var(--vRed)}
.chunk.tagged.O{background:var(--oGreen)}.chunk.tagged.C{background:var(--cPurple)}
.chunk .badge{font-family:'Space Mono',monospace;font-size:.62rem;display:block;opacity:.85}
.tagbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.tagbtn{font-family:'Space Mono',monospace;font-size:.74rem;border:1.5px solid var(--parch-deep);
  background:#fff;border-radius:9px;padding:7px 13px;cursor:pointer;transition:.15s}
.tagbtn:hover{transform:translateY(-2px)}
.tagbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tagbtn.sel{color:#fff}
.tagbtn.sel[data-t=&quot;S&quot;]{background:var(--sBlue);border-color:var(--sBlue)}
.tagbtn.sel[data-t=&quot;V&quot;]{background:var(--vRed);border-color:var(--vRed)}
.tagbtn.sel[data-t=&quot;O&quot;]{background:var(--oGreen);border-color:var(--oGreen)}
.tagbtn.sel[data-t=&quot;C&quot;]{background:var(--cPurple);border-color:var(--cPurple)}
.hint-line{font-size:.84rem;color:#7a6f8f;margin-bottom:10px}

/* skeleton box */
.skeleton{font-family:'Space Mono',monospace;background:var(--ink);color:#ffd977;
  border-radius:12px;padding:14px 16px;font-size:.86rem;line-height:1.9;margin:12px 0;
  word-break:break-word}
.skeleton .cn{color:#8fd8ff}

/* word choice table */
.wtable{width:100%;border-collapse:collapse;margin-top:10px;font-size:.88rem}
.wtable th{background:var(--parch);text-align:left;padding:9px 11px;font-weight:700;
  font-size:.78rem;letter-spacing:.04em;color:var(--violet);border-bottom:2px solid var(--parch-deep)}
.wtable td{padding:9px 11px;border-bottom:1px solid var(--parch-deep);vertical-align:top}
.wtable tr:last-child td{border-bottom:none}
.wtable .win{color:var(--teal);font-weight:700}
.wtable .lose{color:#9a8fb3;text-decoration:line-through}
.wtable .why{color:#5c5170;font-size:.83rem}

.answer-box{background:#eefaf3;border:1.5px solid var(--teal);border-radius:14px;
  padding:16px 18px;margin-top:14px;display:none}
.answer-box.show{display:block;animation:pop .4s ease}
.answer-box .en{font-size:1.05rem;color:#1f5c55;font-weight:500;line-height:1.85}
.answer-box .lbl{font-family:'Space Mono',monospace;font-size:.66rem;letter-spacing:.12em;
  color:var(--teal);margin-bottom:6px}

/* ---- FINALE ---- */
.finale{display:none;background:var(--ink);color:var(--parch);border-radius:22px;padding:30px 25px;margin-top:26px}
.finale.show{display:block;animation:pop .5s ease}
.finale h2{font-family:'Kalnia',serif;color:var(--gold);font-size:1.5rem;margin-bottom:12px;font-weight:600}
.finale p{font-size:.94rem;color:#d9d0ea}
.final-text{background:rgba(255,255,255,.07);border-radius:14px;padding:19px;margin:16px 0;line-height:1.95;color:#fff}
.checklist{list-style:none;font-size:.88rem}
.checklist li{padding:6px 0 6px 25px;position:relative;color:#d9d0ea}
.checklist li::before{content:&quot;✦&quot;;position:absolute;left:0;color:var(--gold)}
.count{font-family:'Space Mono',monospace;color:var(--gold);font-size:.78rem;margin-top:14px;display:block}

.hidden{display:none!important}

/* MINDMAP */
.mind-intro{background:#fffdf8;border:1px solid var(--parch-deep);border-radius:16px;padding:15px 18px;margin-bottom:16px;font-size:.9rem;color:#54486d}
.mind-intro b{color:var(--violet)}
.mindmap{position:relative;display:flex;flex-direction:column;align-items:center}
.mind-core{background:linear-gradient(135deg,var(--violet),var(--violet-soft));color:#fff;border-radius:99px;padding:16px 30px;font-family:'Kalnia',serif;font-size:1.3rem;font-weight:600;box-shadow:0 6px 20px rgba(91,58,151,.3);z-index:2;position:relative;margin-bottom:6px;text-align:center}
.mind-core .cz{font-family:'Noto Sans TC';font-size:.72rem;opacity:.85;display:block;font-weight:400;margin-top:2px}
.branches{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:8px}
.branch{background:#fffdf8;border:1.5px solid var(--parch-deep);border-radius:16px;overflow:hidden;transition:.2s;position:relative}
.branch::before{content:&quot;&quot;;position:absolute;left:34px;top:-14px;width:2px;height:14px;background:var(--violet-soft);opacity:.5}
.branch:first-child::before{display:none}
.branch.open{border-color:var(--violet-soft);box-shadow:0 6px 18px rgba(91,58,151,.12)}
.branch-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.branch-head:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.bnum{font-family:'Space Mono',monospace;font-weight:700;font-size:.8rem;color:#fff;background:var(--violet-soft);min-width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.branch.open .bnum{background:var(--violet)}
.branch.seen .bnum{background:var(--leaf)}
.btag{font-weight:700;font-size:1.02rem;flex:1}
.bchev{color:var(--violet-soft);transition:transform .25s;font-size:1rem}
.branch.open .bchev{transform:rotate(90deg)}
.branch-body{max-height:0;overflow:hidden;transition:max-height .3s ease;background:var(--parch)}
.branch.open .branch-body{max-height:420px}

    connNo:&quot;中文說「<b>藉由</b>」＝透過某個方法。By + V-ing 最準；To VR（為了）是目的，不對。&quot;,

    words:[

      {zh:&quot;真正&quot;,win:&quot;really&quot;,lose:&quot;very&quot;,why:&quot;really＝真正、確實（修飾動詞 want）；very 不能直接修飾動詞。&quot;}

const UPCOMING=[{date:&quot;7/26&quot;,topic:&quot;敬請期待&quot;},{date:&quot;7/27&quot;,topic:&quot;敬請期待&quot;}];

/* ================= STATE ================= */
const $=id=>document.getElementById(id);
let cur=0, mode='write', solved=0, trSolved=0;

/* ---- day buttons ---- */
function buildDays(){
  const d=$('days'); d.innerHTML='';
  DIARIES.forEach((x,i)=>{
    const b=document.createElement('button');
    b.className='day-btn'+(i===cur?' active':'');
    b.innerHTML=`<span>🌳</span>${x.date}<span class=&quot;dtopic&quot;>${x.topic}</span>`;
    b.onclick=()=>{cur=i;load();};
    d.appendChild(b);
  });
  UPCOMING.forEach(u=>{
    const b=document.createElement('button');
    b.className='day-btn locked';b.disabled=true;
    b.innerHTML=`<span>🌰</span>${u.date}<span class=&quot;dtopic&quot;>${u.topic}</span>`;
    d.appendChild(b);
  });
}

/* ---- mode switch ---- */
document.querySelectorAll('.mode-btn').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    mode=b.dataset.mode;
    $('writeMode').classList.toggle('hidden',mode!=='write');
    $('mindMode').classList.toggle('hidden',mode!=='mind');
    $('transMode').classList.toggle('hidden',mode!=='trans');
    updateBar();
    window.scrollTo({top:0,behavior:'smooth'});
  };
});

/* ================= WRITE MODE ================= */
const CAPS=[&quot;播下一顆種子⋯⋯&quot;,&quot;小芽冒出來了！&quot;,&quot;長出主幹了&quot;,&quot;抽出第一根枝&quot;,&quot;第二根枝也來了&quot;,&quot;樹冠成形！&quot;,&quot;開花了 🌸&quot;,&quot;結果啦！整棵樹長好了&quot;];

function buildWrite(){
  const D=DIARIES[cur], el=$('steps'); el.innerHTML='';
  D.steps.forEach((s,i)=>{
    const c=document.createElement('section');
    c.className='step';
    c.innerHTML=`<div class=&quot;step-head&quot;><div class=&quot;num&quot;>${String(i+1).padStart(2,'0')}</div>
      <div class=&quot;step-title&quot;>${s.title}</div></div>
      <div class=&quot;think&quot;><b>先想：</b>${s.think}</div>
      <div class=&quot;q&quot;>${s.q}</div><div class=&quot;choices&quot;></div><div class=&quot;feedback&quot;></div>`;
    const box=c.querySelector('.choices'), fb=c.querySelector('.feedback');
    s.opts.forEach(o=>{
      const b=document.createElement('button');
      b.className='choice';
      b.innerHTML=`${o.t}<span class=&quot;tag&quot;>${o.tag}</span>`;
      b.onclick=()=>{
        if(o.ok){
          b.classList.add('right');
          box.querySelectorAll('.choice').forEach(x=>x.disabled=true);
          fb.className='feedback ok show';fb.innerHTML=`<b>✓ 答對了 —</b> ${s.ok}`;
          c.classList.add('done');addSentence(s.sent);solved++;
          const p=$('p'+solved); if(p)p.classList.add('grown');
          $('treeCap').textContent=CAPS[solved]||CAPS[CAPS.length-1];
          updateBar();
        }else{
          b.classList.add('wrong');b.disabled=true;
          fb.className='feedback no show';fb.innerHTML=`<b>再想想 —</b> ${s.no}`;
        }
      };
      box.appendChild(b);
    });
    el.appendChild(c);
  });
}
function addSentence(t){
  const d=$('draft'), ph=d.querySelector('.placeholder'); if(ph)ph.remove();
  const sp=document.createElement('span');
  sp.className='s hl';sp.textContent=t+' ';d.appendChild(sp);
  setTimeout(()=>sp.classList.remove('hl'),1400);
}

/* ================= TRANSLATION MODE ================= */
/* ================= MINDMAP MODE ================= */
function buildMind(){
  const D=DIARIES[cur], el=$('mindMap'); el.innerHTML='';
  const map=document.createElement('div');
  map.className='mindmap';
  const core=document.createElement('div');
  core.className='mind-core';
  core.innerHTML=`📔 ${D.date}<span class=&quot;cz&quot;>${D.core}</span>`;
  map.appendChild(core);

  const branches=document.createElement('div');
  branches.className='branches';
  D.mind.forEach((m,i)=>{
    if(i>0){const a=document.createElement('div');a.className='flow-arrow';a.textContent='↓';branches.appendChild(a);}
    const b=document.createElement('div');
    b.className='branch';
    b.innerHTML=`
      <div class=&quot;branch-head&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-expanded=&quot;false&quot;>
        <span class=&quot;bnum&quot;>${i+1}</span>
        <span class=&quot;btag&quot;>${m.tag}</span>
        <span class=&quot;bchev&quot;>▶</span>
      </div>
      <div class=&quot;branch-body&quot;><div class=&quot;branch-inner&quot;>
        <div class=&quot;draw-box&quot;><span class=&quot;dl&quot;>✏️ 畫這個</span>${m.draw}</div>
        <div class=&quot;flow-box&quot;><span class=&quot;fl&quot;>🔗 怎麼想 · 怎麼接下一句</span>${m.flow}</div>
      </div></div>`;
    const head=b.querySelector('.branch-head');
    const toggle=()=>{
      const open=b.classList.toggle('open');
      b.classList.add('seen');
      head.setAttribute('aria-expanded',open);
    };
    head.onclick=toggle;
    head.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggle();}};
    branches.appendChild(b);
  });
  map.appendChild(branches);
  el.appendChild(map);

  let allOpen=false;
  $('mindExpandAll').onclick=()=>{
    allOpen=!allOpen;
    branches.querySelectorAll('.branch').forEach(br=>{
      br.classList.toggle('open',allOpen);
      br.classList.add('seen');
      br.querySelector('.branch-head').setAttribute('aria-expanded',allOpen);
    });
    $('mindExpandAll').textContent=allOpen?'－ 全部收合':'＋ 全部展開';
  };
}

function buildTrans(){
  const D=DIARIES[cur], el=$('transSteps'); el.innerHTML='';
  D.trans.forEach((t,i)=>{
    const c=document.createElement('section');
    c.className='step';
    c.innerHTML=`
      <div class=&quot;step-head&quot;><div class=&quot;num&quot;>${String(i+1).padStart(2,'0')}</div>
        <div class=&quot;step-title&quot;>第 ${i+1} 句</div></div>

      <div class=&quot;zh-line&quot;>
        <div class=&quot;zh-label&quot;>中 文 原 句</div>
        <div class=&quot;zh-text&quot;>${t.zh}</div>
      </div>

      <div class=&quot;think&quot;><b>步驟一 · 標出成分：</b>${t.chunkNote}</div>
      <p class=&quot;hint-line&quot;>先點下面一個標籤，再點一個詞塊，把它標好。</p>
      <div class=&quot;tagbar&quot;>
        <button class=&quot;tagbtn&quot; data-t=&quot;S&quot;>S 主詞</button>
        <button class=&quot;tagbtn&quot; data-t=&quot;V&quot;>V 動詞</button>
        <button class=&quot;tagbtn&quot; data-t=&quot;O&quot;>O 受詞</button>
        <button class=&quot;tagbtn&quot; data-t=&quot;C&quot;>連接詞</button>
      </div>
      <div class=&quot;chunks&quot;></div>
      <div class=&quot;feedback fb1&quot;></div>

      <div class=&quot;stage2 hidden&quot;>
        <div class=&quot;think&quot;><b>步驟二 · 接起來：</b>兩個子句需要一個連接詞。中文常常靠語感就連起來了，英文不行。</div>
        <div class=&quot;q&quot;>${t.connQ}</div>
        <div class=&quot;choices&quot;></div>
        <div class=&quot;feedback fb2&quot;></div>
      </div>

      <div class=&quot;stage3 hidden&quot;>
        <div class=&quot;think&quot;><b>步驟三 · 套進句型：</b>${t.skelExplain}</div>
        <div class=&quot;skeleton&quot;>${t.skeleton}</div>
      </div>

      <div class=&quot;stage4 hidden&quot;>
        <div class=&quot;think&quot;><b>步驟四 · 字辨：</b>意思對不夠，要選<b>最精準</b>的字。學測的分數就差在這裡。</div>
        <table class=&quot;wtable&quot;>
          <thead><tr><th>中文</th><th>✓ 用這個</th><th>✗ 別用</th><th>為什麼</th></tr></thead>
          <tbody>${t.words.map(w=>`<tr><td>${w.zh}</td><td class=&quot;win&quot;>${w.win}</td>
            <td class=&quot;lose&quot;>${w.lose}</td><td class=&quot;why&quot;>${w.why}</td></tr>`).join('')}</tbody>
        </table>
        <div class=&quot;answer-box show&quot;>
          <div class=&quot;lbl&quot;>完 成 的 英 文 句</div>
          <div class=&quot;en&quot;>${t.en}</div>
        </div>
      </div>`;

    /* --- stage 1 logic --- */
    const chunksBox=c.querySelector('.chunks'), fb1=c.querySelector('.fb1');
    const tagbtns=c.querySelectorAll('.tagbtn');
    let selTag=null, doneCount=0;
    tagbtns.forEach(tb=>tb.onclick=()=>{
      tagbtns.forEach(x=>x.classList.remove('sel'));
      tb.classList.add('sel'); selTag=tb.dataset.t;
    });
    t.chunks.forEach(ch=>{
      const b=document.createElement('button');
      b.className='chunk'; b.textContent=ch.txt;
      b.onclick=()=>{
        if(!selTag){fb1.className='feedback no show';fb1.innerHTML='先在上面選一個標籤（S／V／O／連接詞），再點詞塊。';return;}
        if(selTag===ch.ans){
          b.classList.add('tagged',ch.ans);
          b.innerHTML=`${ch.txt}<span class=&quot;badge&quot;>${ch.ans}</span>`;
          b.disabled=true;
          fb1.className='feedback ok show';fb1.innerHTML=`<b>✓ </b>${ch.why}`;
          doneCount++;
          if(doneCount===t.chunks.length){
            fb1.innerHTML='<b>✓ 骨架標好了！</b>成分清楚了，接下來想連接詞。';
            c.querySelector('.stage2').classList.remove('hidden');
          }
        }else{
          fb1.className='feedback no show';
          fb1.innerHTML=`<b>不是 ${selTag} 喔 —</b> 再想想「${ch.txt}」在句子裡扮演什麼角色。`;
        }
      };
      chunksBox.appendChild(b);
    });

    /* --- stage 2 logic --- */
    const cbox=c.querySelector('.stage2 .choices'), fb2=c.querySelector('.fb2');
    t.connOpts.forEach(o=>{
      const b=document.createElement('button');
      b.className='choice';
      b.innerHTML=`${o.t}<span class=&quot;tag&quot;>${o.tag}</span>`;
      b.onclick=()=>{
        if(o.ok){
          b.classList.add('right');
          cbox.querySelectorAll('.choice').forEach(x=>x.disabled=true);
          fb2.className='feedback ok show';fb2.innerHTML=`<b>✓ 答對了 —</b> ${t.connOk}`;
          c.querySelector('.stage3').classList.remove('hidden');
          c.querySelector('.stage4').classList.remove('hidden');
          c.classList.add('done');
          trSolved++; updateBar();
        }else{
          b.classList.add('wrong');b.disabled=true;
          fb2.className='feedback no show';fb2.innerHTML=`<b>再想想 —</b> ${t.connNo}`;
        }
      };
      cbox.appendChild(b);
    });

    el.appendChild(c);
  });
}

/* ================= SHARED ================= */
function updateBar(){
  const D=DIARIES[cur];
  if(mode==='write'){
    const tot=D.steps.length;
    $('fill').style.width=(solved/tot*100)+'%';
    $('pct').textContent=`${solved} / ${tot}`;
    if(solved===tot) finish();
  }else{
    const tot=D.trans.length;
    $('fill').style.width=(trSolved/tot*100)+'%';
    $('pct').textContent=`${trSolved} / ${tot}`;
  }
}
function finish(){
  const D=DIARIES[cur], full=D.steps.map(s=>s.sent).join(' ');
  $('finalText').textContent=full;
  $('wordCount').textContent=`共 ${full.trim().split(/\s+/).length} 字 · ${D.steps.length} 個句子 · ${D.patterns.length} 個課本句型`;
  $('patternList').innerHTML=D.patterns.map(p=>`<li>${p}</li>`).join('');
  $('finale').classList.add('show');
  setTimeout(()=>$('finale').scrollIntoView({behavior:'smooth',block:'center'}),350);
}
function load(){
  solved=0; trSolved=0;
  buildDays();
  $('dayLabel').textContent=DIARIES[cur].date;
  $('finale').classList.remove('show');
  $('draft').innerHTML='<span class=&quot;placeholder&quot;>還是一張白紙⋯⋯往下開始吧！</span>';
  document.querySelectorAll('.sprout-part').forEach(p=>p.classList.remove('grown'));
  $('treeCap').textContent=CAPS[0];
  buildWrite(); buildMind(); buildTrans(); updateBar();
  $('mindExpandAll').textContent='＋ 全部展開';
  window.scrollTo({top:0,behavior:'smooth'});
}
load();
</script>

.gram{margin-top:12px;font-size:.9rem;color:#5c4a54;background:#fbf6f0;

.gram b{color:var(--rose)}

  color:var(--gold);display:block;margin-bottom:4px}

.vtable{width:100%;border-collapse:collapse;font-size:.9rem}

.vtable tr:last-child td{border-bottom:none}
.vtable .w{font-weight:700;color:var(--plum);white-space:nowrap}
.vtable .pos{font-family:'Space Mono',monospace;font-size:.72rem;color:var(--teal)}

.recall-intro{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px;font-size:.92rem;color:#5c4a54}
.cloze{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;
  margin-bottom:16px;box-shadow:0 2px 0 var(--line)}
.cloze.done{border-color:var(--teal);box-shadow:0 2px 0 rgba(47,125,117,.3)}
.cloze .idx{font-family:'Space Mono',monospace;font-size:.7rem;color:var(--magenta);letter-spacing:.1em;font-weight:700}

.cloze .en-blank{font-size:1.04rem;line-height:2.1;color:var(--plum)}
.blank{display:inline-block;min-width:70px;border-bottom:2px dashed var(--magenta-soft);
  text-align:center;font-weight:700;color:transparent;position:relative;padding:0 6px;
  transition:.2s}
.blank.filled{color:var(--teal);border-bottom-color:var(--teal)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.opt{font-family:inherit;font-size:.9rem;background:var(--paper);border:1.5px solid var(--line);

.opt.used{opacity:.35;text-decoration:line-through;cursor:default}
.opt.wrong{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cloze-done-msg{margin-top:12px;font-size:.88rem;color:var(--teal);font-weight:500;display:none}
.cloze-done-msg.show{display:block;animation:fade .3s}

/* FINISH */
.finish{display:none;background:var(--ink);color:var(--paper);border-radius:20px;
  padding:26px 24px;margin-top:20px;text-align:center}
.finish.show{display:block;animation:fade .5s}
.finish h3{font-family:'Kalnia',serif;color:var(--gold);font-size:1.4rem;margin-bottom:10px;font-weight:600}
.finish .full{background:rgba(255,255,255,.08);border-radius:12px;padding:16px;margin-top:14px;

.hint-tip{font-size:.8rem;color:#a88;text-align:center;margin-top:10px}

.branches{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:8px}
.branch{background:#fff;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;

.branch::before{content:&quot;&quot;;position:absolute;left:34px;top:-14px;width:2px;height:14px;

.branch:first-child::before{display:none}
.branch.open{border-color:var(--magenta-soft);box-shadow:0 6px 18px rgba(192,49,107,.12)}

.branch-head:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.bnum{font-family:'Space Mono',monospace;font-weight:700;font-size:.8rem;color:#fff;

.branch.seen .bnum{background:var(--teal)}
.btag{font-weight:700;font-size:1.02rem;flex:1}
.bchev{color:var(--magenta-soft);transition:transform .25s;font-size:1rem}

.draw-box{background:#fffdf8;border:1.5px dashed var(--gold);border-radius:12px;padding:12px 14px;

.flow-arrow{text-align:center;color:var(--magenta-soft);font-size:1.1rem;margin:2px 0;opacity:.6}
.mind-tip{text-align:center;font-size:.82rem;color:#a88;margin-top:14px}
.expand-all{display:block;margin:0 auto 14px;font-family:inherit;font-size:.84rem;

/* ===================== RENDER ===================== */
const $=id=>document.getElementById(id);
let cur=0, done=new Set();

/* essay buttons */
function buildGrid(){
  const g=$('essayGrid'); g.innerHTML='';
  ESSAYS.forEach((e,i)=>{
    const b=document.createElement('button');
    b.className='essay-btn'+(i===cur?' active':'');
    b.innerHTML=`<span class=&quot;emoji&quot;>${e.emoji}</span>
      <span class=&quot;no&quot;>${String(i+1).padStart(2,'0')}</span>
      <span class=&quot;zh&quot;>${e.zh}</span>
      <span class=&quot;en&quot;>${e.en}</span>`;
    b.onclick=()=>{cur=i;load();};
    g.appendChild(b);
  });
}

/* scene */
function buildScene(){
  const e=ESSAYS[cur];
  $('scene').dataset.emoji=e.emoji;
  $('sceneEn').textContent=e.en;
  $('sceneZh').textContent=`${e.n}　${e.zh}`;
  $('sceneImagine').innerHTML='🎬 '+e.scene;
  $('barTitle').textContent=`${e.n}　${e.zh}`;
}

/* read + grammar panel */
function buildRead(){
  const e=ESSAYS[cur], el=$('panel-read'); el.innerHTML='';
  e.s.forEach((s,i)=>{
    const c=document.createElement('div');
    c.className='scard';
    c.innerHTML=`<div class=&quot;idx&quot;>SENTENCE ${i+1}</div>
      <div class=&quot;zh&quot;>${s.zh}</div>
      <div class=&quot;en&quot;>${s.en}</div>
      <div class=&quot;gram&quot;><span class=&quot;lbl&quot;>文法 · ${s.gram.lbl}</span>${s.gram.t}</div>`;
    el.appendChild(c);
  });
}

/* mindmap panel */
function buildMind(){
  const e=ESSAYS[cur], el=$('panel-mind'); el.innerHTML='';
  const intro=document.createElement('div');
  intro.className='mind-intro';
  intro.innerHTML='🧠 中心是<b>主題</b>，五個分支是<b>五句</b>。點開每個分支：上面是<b>怎麼畫這句的畫面</b>，下面是<b>這句在想什麼、怎麼接到下一句</b>。照著分支順序，一句就會勾出下一句。';
  el.appendChild(intro);

  const expandBtn=document.createElement('button');
  expandBtn.className='expand-all';
  expandBtn.textContent='＋ 全部展開';
  el.appendChild(expandBtn);

  const map=document.createElement('div');
  map.className='mindmap';
  const core=document.createElement('div');
  core.className='mind-core';
  core.innerHTML=`${e.emoji} ${e.en}<span class=&quot;cz&quot;>${e.core}</span>`;
  map.appendChild(core);

  const branches=document.createElement('div');
  branches.className='branches';
  e.mind.forEach((m,i)=>{
    const wrap=document.createElement('div');
    // arrow between branches
    if(i>0){const a=document.createElement('div');a.className='flow-arrow';a.textContent='↓';branches.appendChild(a);}
    const b=document.createElement('div');
    b.className='branch';
    b.innerHTML=`
      <div class=&quot;branch-head&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-expanded=&quot;false&quot;>
        <span class=&quot;bnum&quot;>${i+1}</span>
        <span class=&quot;btag&quot;>${m.tag}</span>
        <span class=&quot;bchev&quot;>▶</span>
      </div>
      <div class=&quot;branch-body&quot;><div class=&quot;branch-inner&quot;>
        <div class=&quot;draw-box&quot;><span class=&quot;dl&quot;>✏️ 畫這個</span>${m.draw}</div>
        <div class=&quot;flow-box&quot;><span class=&quot;fl&quot;>🔗 怎麼想 · 怎麼接下一句</span>${m.flow}</div>
      </div></div>`;
    const head=b.querySelector('.branch-head');
    const toggle=()=>{
      const open=b.classList.toggle('open');
      b.classList.add('seen');
      head.setAttribute('aria-expanded',open);
    };
    head.onclick=toggle;
    head.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggle();}};
    branches.appendChild(b);
  });
  map.appendChild(branches);
  el.appendChild(map);

  const tip=document.createElement('div');
  tip.className='mind-tip';
  tip.textContent='💡 建議：拿張白紙照著「✏️ 畫這個」把五格畫出來，只寫關鍵字，不要寫整句——回想時看圖就能講出整句。';
  el.appendChild(tip);

  let allOpen=false;
  expandBtn.onclick=()=>{
    allOpen=!allOpen;
    branches.querySelectorAll('.branch').forEach(br=>{
      br.classList.toggle('open',allOpen);
      br.classList.add('seen');
      br.querySelector('.branch-head').setAttribute('aria-expanded',allOpen);
    });
    expandBtn.textContent=allOpen?'－ 全部收合':'＋ 全部展開';
  };
}

/* vocab panel */
function buildVocab(){
  const e=ESSAYS[cur], el=$('panel-vocab'); el.innerHTML='';
  const seen=new Set(); const rows=[];
  e.s.forEach(s=>s.vocab.forEach(v=>{
    if(!seen.has(v[0])){seen.add(v[0]);rows.push(v);}
  }));
  const card=document.createElement('div');
  card.className='scard';
  card.innerHTML=`<table class=&quot;vtable&quot;>
    <thead><tr><th>單字／片語</th><th>詞性</th><th>中文解釋</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td class=&quot;w&quot;>${r[0]}</td><td class=&quot;pos&quot;>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody>
  </table>`;
  el.appendChild(card);
}

/* recall / cloze panel */
function buildRecall(){
  const e=ESSAYS[cur], el=$('clozeList'); el.innerHTML='';
  $('finish').classList.remove('show');
  let solvedSentences=0;
  e.s.forEach((s,si)=>{
    // build blanked english
    let html=s.en;
    s.keys.forEach((k,ki)=>{
      html=html.replace(`<k>${k}</k>`,`<span class=&quot;blank&quot; data-s=&quot;${si}&quot; data-k=&quot;${ki}&quot; data-ans=&quot;${k.replace(/&quot;/g,'&amp;quot;')}&quot;></span>`);
    });
    // strip any leftover <k> tags just in case
    html=html.replace(/<\/?k>/g,'');
    const c=document.createElement('div');
    c.className='cloze';
    // shuffle options for this sentence
    const shuffled=[...s.keys].map((v,idx)=>({v,idx})).sort(()=>Math.random()-0.5);
    c.innerHTML=`<div class=&quot;idx&quot;>SENTENCE ${si+1}</div>
      <div class=&quot;zh&quot;>${s.zh}</div>
      <div class=&quot;en-blank&quot;>${html}</div>
      <div class=&quot;opts&quot;>${shuffled.map(o=>`<button class=&quot;opt&quot; data-v=&quot;${o.v.replace(/&quot;/g,'&amp;quot;')}&quot;>${o.v}</button>`).join('')}</div>
      <div class=&quot;cloze-done-msg&quot;>✓ 這句背對了！</div>`;
    el.appendChild(c);

    const blanks=[...c.querySelectorAll('.blank')];
    const opts=[...c.querySelectorAll('.opt')];
    let filled=0;
    opts.forEach(op=>{
      op.onclick=()=>{
        if(op.classList.contains('used'))return;
        // find first empty blank whose answer matches
        const target=blanks.find(b=>!b.classList.contains('filled') &amp;&amp; b.dataset.ans===op.dataset.v);
        // must fill in order: first unfilled blank
        const nextBlank=blanks.find(b=>!b.classList.contains('filled'));
        if(nextBlank &amp;&amp; nextBlank.dataset.ans===op.dataset.v){
          nextBlank.classList.add('filled');
          nextBlank.textContent=op.dataset.v;
          op.classList.add('used');
          filled++;
          if(filled===blanks.length){
            c.classList.add('done');
            c.querySelector('.cloze-done-msg').classList.add('show');
            solvedSentences++;
            done.add(cur+'-'+si);
            updateBar();
            if(solvedSentences===e.s.length) showFinish();
          }
        }else{
          op.classList.add('wrong');
          setTimeout(()=>op.classList.remove('wrong'),350);
        }
      };
    });
  });
}
function showFinish(){
  const e=ESSAYS[cur];
  const full=e.s.map(s=>s.en.replace(/<\/?k>/g,'')).join(' ');
  $('finishFull').innerHTML=full;
  $('finish').classList.add('show');
  setTimeout(()=>$('finish').scrollIntoView({behavior:'smooth',block:'center'}),300);
}

function updateBar(){
  const e=ESSAYS[cur];
  let cnt=0;
  e.s.forEach((s,si)=>{if(done.has(cur+'-'+si))cnt++;});
  $('barFill').style.width=(cnt/e.s.length*100)+'%';
  $('barCount').textContent=`背誦 ${cnt} / ${e.s.length}`;
}

/* mode tabs */
document.querySelectorAll('.mtab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.mtab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    ['read','mind','vocab','recall'].forEach(p=>$('panel-'+p).classList.toggle('show',p===t.dataset.p));
  };
});

function load(){
  done=new Set(); // reset progress per essay view
  buildGrid();
  buildScene();
  buildRead();
  buildMind();
  buildVocab();
  buildRecall();
  updateBar();
  // reset to read tab
  document.querySelectorAll('.mtab').forEach((x,i)=>x.classList.toggle('active',i===0));
  ['read','mind','vocab','recall'].forEach((p,i)=>$('panel-'+p).classList.toggle('show',i===0));
  window.scrollTo({top:0,behavior:'smooth'});
}
load();
</script>
</body>
</html>

  badge:{icon:&quot;🥈&quot;,title:&quot;假設語氣達人&quot;,sub:&quot;退格與 WCSM，再也不會搞混！&quot;}
},
p3:{

/* ================= STATE &amp; FX ================= */
const $=id=>document.getElementById(id);
let stars=0, streak=0, maxStars=0;
// count total questions
Object.values(TOPICS).forEach(t=>t.stages.forEach(s=>maxStars+=s.qs.length));

function addStar(x,y){
  stars++; streak++;
  $('xpFill').style.width=(stars/maxStars*100)+'%';
  $('xpNum').textContent=stars+' 顆星';
  $('streak').textContent=streak>=2?('🔥 連對 '+streak):'';
  floatXP(x,y);
  if(streak>0 &amp;&amp; streak%3===0) burstConfetti(18);
}
function breakStreak(){streak=0;$('streak').textContent='';}

function floatXP(x,y){
  const el=document.createElement('div');
  el.className='xp-pop';el.textContent='+1 ⭐';
  el.style.left=x+'px';el.style.top=y+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}
function burstConfetti(n){
  const colors=['#6fbf94','#e5c06a','#b48fe0','#c0537a','#2f7d75','#c8912f'];
  for(let i=0;i<n;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.background=colors[i%colors.length];
    c.style.left=(50+(Math.random()*40-20))+'%';
    c.style.top='40%';
    c.style.borderRadius=Math.random()>.5?'50%':'2px';
    $('fx').appendChild(c);
    const dx=(Math.random()*2-1)*260, dy=200+Math.random()*260, rot=Math.random()*720;
    c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:`translate(${dx}px,${dy}px) rotate(${rot}deg)`,opacity:0}],
      {duration:1100+Math.random()*700,easing:'cubic-bezier(.2,.6,.4,1)'});
    setTimeout(()=>c.remove(),1900);
  }
}
function showBadge(b){
  burstConfetti(46);
  const el=document.createElement('div');
  el.className='badge-pop show';
  el.innerHTML=`<span class=&quot;bi&quot;>${b.icon}</span><div class=&quot;bt&quot;>🎉 ${b.title} 🎉</div><div class=&quot;bs&quot;>${b.sub}</div>`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2000);
}

/* ================= RENDER ================= */
function buildTopic(key){
  const T=TOPICS[key], el=$('tp-'+key); el.innerHTML='';
  // concept
  const c=document.createElement('div');
  c.className='concept '+T.cls;
  c.innerHTML=`<h2>${T.medal} ${T.concept.title}</h2>
    <div class=&quot;mantra&quot;>🗝️ ${T.concept.mantra}</div>
    <p>${T.concept.body}</p>
    <div class=&quot;eg&quot;>${T.concept.eg.replace(/\n/g,'<br>')}</div>`;
  el.appendChild(c);

  let stageDoneCount=0;
  const totalStages=T.stages.length;

  T.stages.forEach((stage,si)=>{
    const lab=document.createElement('div');
    lab.className='stage-label '+T.cls;
    lab.innerHTML=`<span class=&quot;dot&quot; style=&quot;background:var(--${T.cls})&quot;>${si+1}</span>
      <span class=&quot;st&quot;>${stage.label}</span><span class=&quot;sc&quot; id=&quot;sc-${key}-${si}&quot;>0/${stage.qs.length}</span>`;
    el.appendChild(lab);

    let solved=0;
    const done=document.createElement('div');
    done.className='stage-done';
    done.innerHTML=`✓ 這關全對！${si+1<totalStages?'下一關更強 💪':'最後一關也破了！'}`;

    stage.qs.forEach((q,qi)=>{
      if(stage.sort){
        el.appendChild(buildSort(key,si,qi,q,stage,()=>{
          solved++;$(`sc-${key}-${si}`).textContent=`${solved}/${stage.qs.length}`;
          if(solved===stage.qs.length){done.classList.add('show');stageDoneCount++;checkTopicDone();}
        }));
      }else{
        el.appendChild(buildQ(key,si,qi,q,()=>{
          solved++;$(`sc-${key}-${si}`).textContent=`${solved}/${stage.qs.length}`;
          if(solved===stage.qs.length){done.classList.add('show');stageDoneCount++;checkTopicDone();}
        }));
      }
    });
    el.appendChild(done);
  });

  function checkTopicDone(){
    if(stageDoneCount===totalStages){
      setTimeout(()=>showBadge(T.badge),400);
    }
  }
}

function buildQ(key,si,qi,q,onSolve){
  const g=document.createElement('div');
  g.className='game q-'+key;
  const sentHtml=q.sent.replace('___','<span class=&quot;gap&quot;>___</span>');
  g.innerHTML=`<div class=&quot;qtag&quot;>誰做動作：${q.owner}</div>
    <div class=&quot;sent&quot;>${sentHtml}</div>
    <div class=&quot;opts&quot;></div>
    <div class=&quot;explain&quot;><b>✓ 答對！</b> ${q.ex}
      <div class=&quot;restore&quot;>🔧 還原：${q.restore}</div></div>`;
  const opts=g.querySelector('.opts');
  const gap=g.querySelector('.gap');
  const explain=g.querySelector('.explain');
  // shuffle
  [...q.opts].sort(()=>Math.random()-.5).forEach(o=>{
    const b=document.createElement('button');
    b.className='opt';b.textContent=o;
    b.onclick=(ev)=>{
      if(g.classList.contains('correct'))return;
      if(o===q.ans){
        b.classList.add('right','chosen');
        opts.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        gap.textContent=o;gap.classList.add('ok');
        explain.classList.add('show');
        g.classList.add('correct');
        const r=b.getBoundingClientRect();
        addStar(r.left+r.width/2,r.top);
        onSolve();
      }else{
        b.classList.add('wrong');b.disabled=true;
        breakStreak();
      }
    };
    opts.appendChild(b);
  });
  return g;
}

function buildSort(key,si,qi,q,stage,onSolve){
  const g=document.createElement('div');
  g.className='sortgame';
  g.innerHTML=`<div class=&quot;qtag&quot;>這個 V-ing / p.p. 是哪一種？</div>
    <div class=&quot;sent&quot;>${q.sentOverride||q.sent}</div>
    <div class=&quot;sort-opts&quot;></div>
    <div class=&quot;explain&quot;><b>✓ 對！</b> ${q.why}</div>`;
  const box=g.querySelector('.sort-opts');
  const explain=g.querySelector('.explain');
  [...stage.sortOpts].sort(()=>Math.random()-.5).forEach(o=>{
    const b=document.createElement('button');
    b.className='sort-btn';b.textContent=o;
    b.onclick=(ev)=>{
      if(g.classList.contains('correct'))return;
      if(o===q.ans){
        b.classList.add('right');
        box.querySelectorAll('.sort-btn').forEach(x=>x.disabled=true);
        explain.classList.add('show');
        g.classList.add('correct');
        const r=b.getBoundingClientRect();
        addStar(r.left+r.width/2,r.top);
        onSolve();
      }else{
        b.classList.add('wrong');b.disabled=true;
        breakStreak();
      }
    };
    box.appendChild(b);
  });
  return g;
}

/* tabs */
document.querySelectorAll('.ttab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.ttab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    ['p1','p2','p3'].forEach(k=>$('tp-'+k).classList.toggle('show',k===t.dataset.t));
    window.scrollTo({top:0,behavior:'smooth'});
  };
});

buildTopic('p1');buildTopic('p2');buildTopic('p3');
</script>
